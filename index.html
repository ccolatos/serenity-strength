<style>
:root {
  --bg: #F4F4F0; --surface: #FFFFFF; --fog: #E8EAE4; --line: #D3D7CF; --ink: #1D2A2F; --ink-2: #4C5B61; --muted: #5F6C71;
  --accent: #1E6E62; --accent-ink: #F4F4F0; --tint: #DDEBE6; --tint-ink: #17544B; --danger: #A33A2F; --warn: #8A6A1A; --warn-bg: #F3ECD8;
  --hero: #1D2A2F; --hero-ink: #F4F4F0; --hero-muted: #A9B4B8; --hero-line: rgba(244,244,240,.18);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", "URW Palladio L", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", system-ui, sans-serif;
  --r: 14px; --r-s: 10px; --pad: 20px; --nav-h: 62px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #121B1B; --surface: #1A2626; --fog: #223030; --line: #33423F; --ink: #ECEEE8; --ink-2: #B8C2BD; --muted: #86948F;
    --accent: #4FB39F; --accent-ink: #0F1A18; --tint: #1E3A34; --tint-ink: #BFE3DA; --danger: #E07A6E; --warn: #E0BE6A; --warn-bg: #2E2A1A;
    --hero: #24343A; --hero-ink: #ECEEE8; --hero-muted: #9FB0B4; --hero-line: rgba(236,238,232,.16); }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; }
button, input, select { font: inherit; color: inherit; }
button { touch-action: manipulation; cursor: pointer; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.sheet-card textarea { width: 100%; min-height: 150px; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px; font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace; background: var(--surface); color: var(--ink); resize: vertical; }
.sheet-card textarea:focus { outline: 2px solid var(--accent); }
h1, h2, h3 { font-family: var(--serif); font-weight: 400; margin: 0; letter-spacing: -0.005em; }
h1 { font-size: 34px; line-height: 1.15; }
h2 { font-size: 26px; line-height: 1.2; }
h3 { font-size: 21px; line-height: 1.25; }
p { margin: 0 0 12px; }
.muted { color: var(--muted); }
.small { font-size: 15px; }
.num { font-variant-numeric: tabular-nums; }
a { color: var(--accent); }

#app { max-width: 520px; margin: 0 auto; min-height: 100vh; }
#screen { padding: calc(env(safe-area-inset-top) + 18px) var(--pad) calc(var(--nav-h) + env(safe-area-inset-bottom) + 28px); }
.screen-title { margin: 6px 0 18px; }

/* Bottom navigation */
#tabs { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
  background: var(--bg); background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid var(--line); display: flex; z-index: 20; }
#tabs .tabs-in { width: 100%; max-width: 520px; margin: 0 auto; display: flex; }
#tabs button { flex: 1; background: none; border: 0; padding: 8px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11.5px; color: var(--muted); }
#tabs button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#tabs button[aria-current="page"] { color: var(--accent); }
#tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 8px; }

/* Week strip */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 16px 0 22px; }
.week .day { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.week .dot { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-family: var(--serif); font-size: 16px; color: var(--ink-2); background: var(--surface); }
.week .dot.done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.week .dot.plan { border-style: dashed; color: var(--muted); }
.week .day.today .dot { border-color: var(--ink); border-width: 2px; }
.week .day.today { color: var(--ink); font-weight: 600; }
.milestone { font-family: var(--serif); font-size: 20px; line-height: 1.35; margin: -6px 0 20px; color: var(--ink); }

/* Hero card */
.hero { background: var(--hero); color: var(--hero-ink); border-radius: 22px; padding: 22px 22px 18px; margin: 0 0 22px; position: relative; overflow: hidden; }
.hero .kicker { color: var(--hero-muted); font-size: 15px; margin-bottom: 2px; }
.hero h2 { font-size: 30px; }
.hero .meta { color: var(--hero-muted); margin: 6px 0 0; font-size: 15px; }
.hero .figbox { height: 176px; margin: 8px -8px 2px; color: var(--hero-ink); }
.hero .list { list-style: none; margin: 0 0 16px; padding: 0; border-top: 1px solid var(--hero-line); }
.hero .list li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--hero-line); font-size: 15.5px; }
.hero .list li .rx { color: var(--hero-muted); white-space: nowrap; }
.hero .btn.primary { width: 100%; }
.hero .btn.quiet { color: var(--hero-ink); }
.hero .note { color: var(--hero-muted); font-size: 14px; margin-top: 10px; }

/* Figures */
.figbox { width: 100%; height: 190px; display: grid; place-items: center; }
.fig { width: 100%; height: 100%; max-height: 100%; }
.fig-line { fill: none; stroke: currentColor; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
.fig-head { fill: currentColor; }
.fig-floor { stroke: currentColor; opacity: .22; stroke-width: 1.5; }
.fig-db { fill: currentColor; }
.fig-bench, .fig-wall { fill: currentColor; opacity: .16; }
.fig-band { fill: none; stroke: var(--accent); stroke-width: 2.6; stroke-dasharray: 4 3; }
.hero .fig-band { stroke: #7FD1BF; }
.thumb { width: 84px; height: 72px; flex: none; color: var(--ink-2); }
.thumb .fig { width: 100%; height: 100%; }
.thumb .fig-line { stroke-width: 4.5; }
.thumb .fig-floor { display: none; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; border: 1.5px solid transparent; padding: 0 18px; height: 52px; font-weight: 600; font-size: 17px; background: var(--fog); color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.outline { background: transparent; border-color: var(--line); }
.btn.quiet { background: transparent; color: var(--accent); height: auto; min-height: 44px; padding: 8px; white-space: normal; line-height: 1.3; font-weight: 500; }
.btn.danger { background: transparent; color: var(--danger); border-color: var(--line); }
.btn.block { width: 100%; }
.btn.sm { height: 40px; font-size: 15px; padding: 0 14px; border-radius: 10px; }
.btn:disabled { opacity: .45; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; gap: 10px; align-items: center; }
.row > .btn { flex: 1; }
.stack { display: flex; flex-direction: column; gap: 10px; }

/* Sections and lists */
.section { margin: 26px 0 0; }
.section h3 { margin-bottom: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; }
.card + .card { margin-top: 10px; }
.card.tint { background: var(--tint); border-color: transparent; color: var(--tint-ink); }
.card.warn { background: var(--warn-bg); border-color: transparent; color: var(--warn); }
.rows { list-style: none; margin: 0; padding: 0; }
.rows li { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.rows li:last-child { border-bottom: 0; }
.rows .grow { flex: 1; min-width: 0; }
.rows .t { font-size: 17px; }
.rows .s { color: var(--muted); font-size: 14.5px; }
.rows .v { font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
button.rowbtn { all: unset; display: flex; width: 100%; align-items: center; gap: 14px; cursor: pointer; }
button.rowbtn:focus-visible { outline: 2px solid var(--accent); border-radius: 8px; }
.chev { color: var(--muted); flex: none; }
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; background: var(--fog); color: var(--ink-2); font-size: 13px; }
.pill.strong { background: var(--tint); color: var(--tint-ink); }
.pill.moderate { background: var(--fog); }
.pill.indirect { background: transparent; border: 1px solid var(--line); }
.pill.locked { background: transparent; border: 1px solid var(--line); color: var(--muted); }
ul.plain { margin: 0 0 12px; padding-left: 20px; }
ul.plain li { margin-bottom: 6px; }

/* Segmented control and chips */
.seg { display: flex; background: var(--fog); border-radius: 12px; padding: 3px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 9px; height: 40px; font-weight: 500; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; height: 40px; padding: 0 14px; font-weight: 500; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip.sm { height: 34px; padding: 0 12px; font-size: 14.5px; }
.chip.day { width: 41px; padding: 0; justify-content: center; display: inline-flex; align-items: center; }

/* Forms */
.field { margin: 0 0 16px; }
.field label { display: block; font-size: 14.5px; color: var(--muted); margin-bottom: 6px; }
.field input[type="text"], .field input[type="number"], .field select { width: 100%; height: 48px; border: 1.5px solid var(--line); border-radius: 12px; padding: 0 14px; background: var(--surface); font-size: 17px; }
.field input:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
.stepper { display: grid; grid-template-columns: 56px 1fr 56px; align-items: center; height: 60px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }
.stepper button { height: 100%; border: 0; background: transparent; font-size: 28px; color: var(--accent); font-weight: 300; }
.stepper button:active { background: var(--fog); }
.stepper .val { text-align: center; font-family: var(--sans); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stepper .val small { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 4px; }
.stepper.wide { height: 64px; }
.stepper .val input { width: 100%; height: 100%; border: 0; text-align: center; font-size: 26px; font-weight: 600; background: transparent; }
.stepper .val input:focus { outline: none; background: var(--fog); }
.inline-cap { font-size: 13.5px; color: var(--muted); text-align: center; margin-top: 4px; }

/* Session player */
#session { position: fixed; inset: 0; background: var(--bg); z-index: 30; overflow-y: auto; -webkit-overflow-scrolling: touch; }
#session[hidden] { display: none; }
.s-in { max-width: 520px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 12px) var(--pad) calc(env(safe-area-inset-bottom) + 28px); min-height: 100%; }
.s-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.s-top .prog { color: var(--muted); font-size: 14.5px; }
.s-top .x { all: unset; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; color: var(--ink-2); cursor: pointer; margin-right: -8px; }
.s-top .x:focus-visible { outline: 2px solid var(--accent); }
.s-stage { color: var(--muted); font-size: 15px; }
.s-name { margin: 2px 0 6px; }
.s-target { color: var(--ink-2); font-size: 16px; margin-bottom: 4px; }
.s-figure { height: 220px; margin: 4px 0 8px; color: var(--ink); }
.s-figure .fig { max-width: 320px; }
.s-set { display: flex; align-items: baseline; justify-content: space-between; margin: 10px 0 12px; }
.s-set .n { font-family: var(--serif); font-size: 24px; }
.s-set .r { color: var(--muted); font-size: 15px; }
.inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.inputs.one { grid-template-columns: 1fr; }
.effort { margin: 4px 0 16px; }
.effort .chips { display: grid; grid-template-columns: repeat(3, 1fr); }
.effort .chip { padding: 0 6px; font-size: 15px; }
.effort .cap { color: var(--muted); font-size: 13.5px; margin-top: 8px; text-align: center; min-height: 18px; }
.howto { margin: 14px 0 0; border-top: 1px solid var(--line); padding-top: 4px; }
.howto summary { list-style: none; cursor: pointer; padding: 10px 0; font-weight: 600; display: flex; justify-content: space-between; }
.howto summary::-webkit-details-marker { display: none; }
.howto summary::after { content: "+"; color: var(--muted); font-weight: 400; font-size: 22px; line-height: 1; }
.howto[open] summary::after { content: "\2212"; }
.howto ol { padding-left: 20px; margin: 4px 0 10px; }
.howto ol li { margin-bottom: 8px; }
.howto .faults { color: var(--ink-2); font-size: 15px; }
.timerbig { font-family: var(--serif); font-size: 64px; line-height: 1; text-align: center; font-variant-numeric: tabular-nums; margin: 10px 0; }
.suggest { background: var(--tint); color: var(--tint-ink); border-radius: var(--r-s); padding: 10px 14px; font-size: 15px; margin-bottom: 12px; }
.suggest.down { background: var(--warn-bg); color: var(--warn); }

/* Rest overlay */
#rest { position: fixed; inset: 0; z-index: 40; background: var(--hero); color: var(--hero-ink); display: grid; place-items: center; text-align: center; padding: 24px; }
#rest[hidden] { display: none; }
#rest .ring { width: 220px; height: 220px; margin: 0 auto 14px; position: relative; }
#rest svg { width: 100%; height: 100%; transform: rotate(-90deg); }
#rest circle { fill: none; stroke-width: 6; }
#rest .track { stroke: var(--hero-line); }
#rest .arc { stroke: #7FD1BF; stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
#rest .t { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--serif); font-size: 62px; font-variant-numeric: tabular-nums; }
#rest .next { color: var(--hero-muted); margin-bottom: 22px; font-size: 16px; }
#rest .row { justify-content: center; }
#rest .btn { background: rgba(244,244,240,.12); color: var(--hero-ink); border-color: transparent; }
#rest .btn.primary { background: #7FD1BF; color: #0F1A18; }

/* Sheet */
#sheet { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.42); display: flex; align-items: flex-end; justify-content: center; }
#sheet[hidden] { display: none; }
.sheet-card { width: 100%; max-width: 520px; max-height: 88vh; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--bg); border-radius: 22px 22px 0 0; padding: 14px var(--pad) calc(env(safe-area-inset-bottom) + 24px); }
.sheet-card .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 12px; }
.sheet-card h2 { margin-bottom: 4px; }
.sheet-card .figbox { height: 200px; margin: 6px 0; }
.sheet-card .close { margin-top: 18px; }
.sheet-card .refs { font-size: 13.5px; color: var(--muted); }
.sheet-card .refs li { margin-bottom: 8px; }

/* Progress */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 12px 10px; }
.stat .v { font-family: var(--serif); font-size: 30px; line-height: 1.1; }
.stat .l { color: var(--muted); font-size: 13px; margin-top: 2px; }
.chart { width: 100%; height: auto; display: block; }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.chart .pt { fill: var(--accent); }
.chart .ax { stroke: var(--line); stroke-width: 1; }

<script>
/* Serenity Strength figure engine: forward-kinematic line figures in SVG.

  const L = { shin: 40, thigh: 42, torso: 48, neck: 6, head: 9, ua: 26, fa: 24, foot: 16, heel: 6, hipW: 14, shW: 22 };

  const SIDE = { view: 'side', root: 'ankle', ax: 118, ay: FLOOR - 5, hx: 118, hy: 89, clamp: true, ts: 1, ss: 1, s: 0, t: 0, b: 0, hd: 0, ft: 0, s2: null, t2: null, ft2: 0,
    ua: 0, fa: 0, ua2: null, fa2: null, uas: 1, fas: 1, ua2s: 1, fa2s: 1, t2s: 1, s2s: 1, far: 0, props: [] };
  const TOP = { view: 'top', px: 120, py: 108, hy: -12, sp: 28, props: [] };
  const FRONT = { view: 'front', px: 120, tl: 4, tr: 4, sl: 0, sr: 0, kl: 0, kr: 0, lift: 0, lt: 0,
    ual: 6, uar: 6, fal: 6, far: 6, uals: 1, uars: 1, fals: 1, fars: 1, hd: 0, props: [] };

  function solveSide(P) {
    let A, K, H;
    if (P.root === 'hip') { H = [P.hx, P.hy]; K = fd(H, -P.t, L.thigh * P.ts); A = fd(K, -P.s, L.shin * P.ss); }

    const S = up(H, P.b, L.torso);
    const N = up(S, P.b + P.hd, L.neck), HC = up(N, P.b + P.hd, L.head);
    const t2 = P.t2 == null ? P.t : P.t2, s2 = P.s2 == null ? P.s : P.s2;
    const K2 = fd(H, -t2, L.thigh * P.t2s), A2 = fd(K2, -s2, L.shin * P.s2s);
    const fwd2 = rot([Math.cos(s2 * D), Math.sin(s2 * D)], P.ft2);

    if (P.root === 'hip') { const f = rot([Math.cos(P.s * D), Math.sin(P.s * D)], P.ft); toe = add(A, [f[0] * L.foot, f[1] * L.foot]); heel = add(A, [-f[0] * L.heel, -f[1] * L.heel]); }
    else { toe = add(A, rot([L.foot, 5], P.ft)); heel = add(A, rot([-L.heel, 5], P.ft)); }
    const E = fd(S, P.ua, L.ua * P.uas), W = fd(E, P.fa, L.fa * P.fas);
    const ua2 = P.ua2 == null ? P.ua : P.ua2, fa2 = P.fa2 == null ? P.fa : P.fa2;
    const E2 = fd(S, ua2, L.ua * P.ua2s), W2 = fd(E2, fa2, L.fa * P.fa2s);
    const J = { A, K, H, S, N, HC, K2, A2, toe, heel, toe2, heel2, E, W, E2, W2 };
    if (P.root === 'hip' && P.clamp !== false) { const dy = (FLOOR - 5) - Math.max(A[1], A2[1]); for (const k in J) J[k] = [J[k][0], J[k][1] + dy]; }

  }
  function solveTop(P) {
    const C = [P.px, P.py], W = [P.px, P.py + P.hy];
    return { C, W, SL: [P.px - 16, P.py], SR: [P.px + 16, P.py], EL: [P.px - P.sp, P.py + P.hy * 0.55], ER: [P.px + P.sp, P.py + P.hy * 0.55],
      FL: [P.px - 13, P.py + 24], FR: [P.px + 13, P.py + 24], ANCH: [10, P.py] };
  }
  function solveFront(P) {
    const hipY = 0;
    const HL = [P.px - L.hipW / 2, hipY], HR = [P.px + L.hipW / 2, hipY];
    const KL = fd(HL, -P.tl, L.thigh * Math.cos(P.kl * D)), KR = fd(HR, P.tr, L.thigh * Math.cos(P.kr * D));
    const AL = fd(KL, -P.sl, L.shin * Math.cos(P.kl * D * 0.6)), AR = fd(KR, P.sr, L.shin * Math.cos(P.kr * D * 0.6));
    const low = Math.max(AL[1], AR[1]);
    const dy = FLOOR - 4 - low;
    const sh = (p) => [p[0], p[1] + dy];

    const pel = [P.px, hipY + dy];

    const ER = fd(SR, P.uar, L.ua * P.uars), WR = fd(ER, P.far, L.fa * P.fars);

  const NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }

  function create(container, opts = {}) {
    const svg = el('svg', { viewBox: '0 -18 240 218', class: 'fig', 'aria-hidden': 'true' });
    const propsG = el('g', { class: 'fig-props' });
    const farG = el('g', { class: 'fig-far' });
    const nearG = el('g', { class: 'fig-near' });
    const floorEl = el('line', { class: 'fig-floor', x1: 0, y1: FLOOR, x2: 240, y2: FLOOR });
    svg.appendChild(floorEl);
    svg.appendChild(propsG); svg.appendChild(farG); svg.appendChild(nearG);
    container.appendChild(svg);
    const cache = {};
    const line = (g, key) => cache[key] || (cache[key] = g.appendChild(el('polyline', { class: 'fig-line' })));
    const circ = (g, key) => cache[key] || (cache[key] = g.appendChild(el('circle', { class: 'fig-head', r: L.head }))
    );

      const J = solveTop(P);

      farG.removeAttribute('transform'); farG.setAttribute('opacity', '1');
      line(farG, 'leg2').setAttribute('points', pts([[J.FL[0], J.FL[1] - 9], [J.FL[0], J.FL[1] + 9]]));
      line(farG, 'heel2').setAttribute('points', pts([[J.FR[0], J.FR[1] - 9], [J.FR[0], J.FR[1] + 9]]));
      line(farG, 'arm2').setAttribute('points', pts([J.SL, J.EL, J.W]));
      line(nearG, 'leg').setAttribute('points', pts([J.SL, J.SR]));
      line(nearG, 'heel').setAttribute('points', pts([J.SR, J.ER, J.W]));
      line(nearG, 'torso').setAttribute('points', pts([J.C, [J.C[0], J.C[1] - 14]]));
      line(nearG, 'arm').setAttribute('points', pts([J.C, J.C]));
      const hc = circ(nearG, 'head'); hc.setAttribute('cx', J.C[0]); hc.setAttribute('cy', J.C[1]);
      drawProps(P, J);
    }
    function drawSide(P) {
      const J = solveSide(P);
      floorEl.style.display = '';
      farG.setAttribute('transform', 'translate(3 0)');
      farG.setAttribute('opacity', '0.42');
      line(farG, 'leg2').setAttribute('points', pts([J.H, J.K2, J.A2, J.toe2]));
      line(farG, 'heel2').setAttribute('points', pts([J.heel2, J.A2]));
      line(farG, 'arm2').setAttribute('points', pts([J.S, J.E2, J.W2]));
      line(nearG, 'leg').setAttribute('points', pts([J.H, J.K, J.A, J.toe]));
      line(nearG, 'heel').setAttribute('points', pts([J.heel, J.A]));
      line(nearG, 'torso').setAttribute('points', pts([J.H, J.S, J.N]));
      line(nearG, 'arm').setAttribute('points', pts([J.S, J.E, J.W]));

    }
    function drawFront(P) {
      const J = solveFront(P);
      floorEl.style.display = '';
      farG.removeAttribute('transform'); farG.setAttribute('opacity', '1');
      line(farG, 'leg2').setAttribute('points', pts([J.pel, J.hl, J.kl, J.al, [J.al[0] - 7, J.al[1]]]));
      line(farG, 'heel2').setAttribute('points', pts([J.al, [J.al[0] + 7, J.al[1]]]));
      line(farG, 'arm2').setAttribute('points', pts([J.SL, J.EL, J.WL]));
      line(nearG, 'leg').setAttribute('points', pts([J.pel, J.hr, J.kr, J.ar, [J.ar[0] + 7, J.ar[1]]]));
      line(nearG, 'heel').setAttribute('points', pts([J.ar, [J.ar[0] - 7, J.ar[1]]]));
      line(nearG, 'torso').setAttribute('points', pts([J.pel, J.S, J.N]));
      line(nearG, 'sh').setAttribute('points', pts([J.SL, J.SR]));
      line(nearG, 'arm').setAttribute('points', pts([J.SR, J.ER, J.WR]));
      const hc = circ(nearG, 'head'); hc.setAttribute('cx', J.HC[0]); hc.setAttribute('cy', J.HC[1]);
      drawProps(P, J);
    }
    let propEls = [];
    function drawProps(P, J) {
      const want = P.props || [];
      while (propEls.length > want.length) propsG.removeChild(propEls.pop());
      want.forEach((pr, i) => {
        let e = propEls[i];
        const tag = pr.type === 'band' ? 'polyline' : pr.type === 'db' ? 'rect' : 'rect';
        if (!e || e.tagName !== tag) { if (e) propsG.removeChild(e); e = el(tag, {}); propsG.appendChild(e); propEls[i] = e; }
        const at = (ref) => Array.isArray(ref) ? ref : J[ref];
        if (pr.type === 'db') {

          e.setAttribute('x', pr.x); e.setAttribute('y', pr.y); e.setAttribute('width', pr.w); e.setAttribute('height', pr.h);

    let raf = null, running = false, keys = null, base = null, t0 = 0, total = 0, still = null;
    const ease = (u) => 0.5 - 0.5 * Math.cos(Math.PI * u);
    const ANG = { ua: 1, fa: 1, ua2: 1, fa2: 1 };
    function lerpPose(a, b, u) {
      const o = Object.assign({}, a);
      const wrap = a.wrap || b.wrap;

    function draw(P) { (P.view === 'front' ? drawFront : P.view === 'top' ? drawTop : drawSide)(P); }

      set(ex) {

/* Impact ladder, gated by bone status. Tier 1 heel drops, tier 2 hops, tier 3 drop landings. */
function impactPlan(level, bone, caution) {
  const locked3 = 'Drop landings unlock when bone status is set to Normal in Settings (that needs a DEXA result).';
  const locked2 = caution ? 'Impact stays at heel drops while the gentle-impact setting is on in Settings.' : 'Hops stay off with a diagnosis of osteoporosis unless your clinician approves; heel drops carry the impact work.';
  if (caution) bone = 'osteoporosis';
  const hd = (sets, reps) => ({ items: [{ id: 'heel_drops', sets, reps }] });
  const hops = (sets, reps) => ({ id: 'hops', sets, reps });
  const drop = (sets, reps) => ({ id: 'drop_landing', sets, reps });
  if (level === 1) return hd(1, 20);
  if (level === 2) return hd(2, 15);
  if (bone === 'osteoporosis') return Object.assign(hd(level === 3 ? 2 : 3, level === 3 ? 20 : 15), { note: locked2 });
  if (level === 3) return { items: [hops(2, 10)] };
  if (bone === 'normal') {
    return level === 4 ? { items: [drop(3, 8)] } : { items: [drop(3, 10), hops(2, 10)] };
  }
  return level === 4 ? { items: [hops(3, 10)], note: locked3 } : { items: [hops(4, 12)], note: locked3 };
}

/* Resolve a workout for a level into concrete entries. */
function buildWorkout(level, letter, bone, essentials, caution) {
  const L = LEVELS[level], W = WORKOUTS[level][letter];
  let list = W.list.map(e => {
    const ex = EXERCISES[e.id];
    const main = !!e.main;
    const sets = e.sets || (main ? L.mainSets : L.sets);
    const reps = e.secs ? null : (e.reps || (main ? L.mainReps : L.reps));
    return { id: e.id, ex, main, ess: !!e.ess, sets, reps, secs: e.secs || null, variant: e.variant || null,
      rest: main ? L.mainRest : L.rest, sides: !!ex.sides };
  });
  if (essentials) list = list.filter(e => e.ess);
  const imp = impactPlan(level, bone, caution);
  const finisher = imp.items.map(i => ({ id: i.id, ex: EXERCISES[i.id], sets: i.sets, reps: [i.reps, i.reps], secs: null, rest: 30, impact: true, sides: false }));
  const b = W.balance;
  finisher.push({ id: b.id, ex: EXERCISES[b.id], sets: b.sets, reps: b.reps || null, secs: b.secs || null, rest: 15, balance: true, variant: b.variant || null, sides: !!EXERCISES[b.id].sides });
  const warm = WARMUPS[level].map(w => ({ id: w.id, ex: EXERCISES[w.id], secs: w.secs || null, reps: w.reps || null }));
  return { level, letter, title: W.title, warm, list, finisher: essentials ? finisher.slice(0, 1) : finisher, note: imp.note || null, essentials: !!essentials };
}

function estimateMinutes(w) {
  /* Mirrors the player: warm-up items, then every logged set is followed by its rest (the last set's rest leads into the next movement). */
  let s = 0;
  w.warm.forEach(e => { s += e.secs ? e.secs + 6 : e.reps * 3 + 8; });
  const work = (e) => { const per = e.secs ? e.secs + 8 : (e.reps[1] * 3 + 8); return per * (e.sides ? 2 : 1); };
  w.list.forEach(e => { s += e.sets * (work(e) + e.rest); });
  w.finisher.forEach(e => { s += e.sets * ((e.impact ? e.reps[1] * 1.6 + 10 : work(e)) + e.rest); });
  return Math.round(s / 60);
}

function weekTarget() { return S.schedule.mode === 'pinned' && S.schedule.days.length ? S.schedule.days.length : 3; }

    const ws = weekStart(new Date()); const wsk = todayKey(ws);

      if (run >= 12) list.push({ key: 'weeks-12', text: 'Twelve weeks in a row at your target.' });

function fullAtLevel() { return S.sessions.filter(s => s.level === S.level && !s.essentials && s.complete !== false && s.day >= S.levelStart); }

const REF_ORDER = Object.keys(REFS).sort((a, b) => REFS[a].localeCompare(REFS[b], 'en', { sensitivity: 'base' }));

const CARDS = [
  { id: 'why', title: 'Why heavy, and why impact', body: `<p>Bone is living tissue that adapts to the loads it meets. After menopause the rate of bone loss speeds up for several years, most steeply around the final period, which is why the timing of a program like this matters.</p><p>Two kinds of loading have the best evidence. Progressive resistance training with heavy weights sends compressive force through the hip and spine; in the LIFTMOR trial, eight months of twice-weekly, supervised 30-minute sessions of barbell deadlifts, squats and overhead presses at over 85 percent of maximum raised spine density by about 3 percent in postmenopausal women with low bone mass, with no serious injuries. Brief impact, such as heel drops, hops and drop landings, gives the jolt that steady exercise like walking or swimming does not. The Australian position statement recommends both, plus balance training, and advises against loaded spinal flexion (sit-ups with weight, toe-touch stretches under load).</p><p>The five levels here start light and build toward the LIFTMOR scheme of five sets of five on the main lift, with the impact ladder gated by your bone status. This is a dumbbell adaptation for home use; the trial itself used barbells with a supervisor present, and the adaptation has not been tested in a trial of its own, which is one reason a coach's eyes on your form in the early sessions are worth having.</p>`, refs: ['liftmor', 'essa', 'swan'] },
  { id: 'effort', title: 'How the effort scale works', body: `<p>After each set you tap one of three words.</p><ul class="plain"><li><b>Easy.</b> You could have done three or more extra reps.</li><li><b>Just right.</b> One or two reps were left. This is where most sets should land.</li><li><b>Hard.</b> Nothing left, or your form slipped on the last rep.</li></ul><p>When every set of an exercise hits the top of its rep range without a Hard, the app suggests more weight next time: one equipment step while the load is light (a large jump in percentage terms, which fixed dumbbell steps make unavoidable), growing to 5 lb per dumbbell on lower-body lifts and 2.5 lb on upper-body lifts once loads are moderate, where each step lands near the 2 to 10 percent the ACSM describes. If reps fall short or two sets are Hard, it suggests a step down. You always decide; the suggestion is the default in the weight box, and you can change it.</p><p>The rep ranges are wide on purpose. Position statements for older adults recommend beginning with lighter loads and 10 to 15 reps, then progressing over months toward heavier loads for fewer reps, which is what the levels do; the Australian guidance suggests new lifters ramp up over their first few sessions rather than starting heavy, which is why the app says to begin with a weight you could lift about 15 times.</p>`, refs: ['nsca', 'acsm', 'essa'] },
  { id: 'bone', title: 'Bone status and the impact ladder', body: `<p>The impact work climbs a ladder: heel drops, then two-foot hops, then drop landings from a low step. Where you can climb depends on the bone status set in Settings.</p><ul class="plain"><li><b>Unknown</b> (the default with no DEXA scan): heel drops from Level 1, hops from Level 3. Drop landings stay locked.</li><li><b>Normal</b> (T-score of minus 1.0 or higher): the full ladder; drop landings from Level 4.</li><li><b>Osteopenia</b> (T-score between minus 1.0 and minus 2.5): same as unknown. The LIFTMOR participants had osteopenia or osteoporosis and did drop landings safely, but under supervision.</li><li><b>Osteoporosis</b> (T-score of minus 2.5 or lower, or diagnosed from a fragility fracture): heel drops only, and a word with your clinician before hops. The UK consensus statement advises against landing from a height with osteoporosis.</li></ul><p>Set this to what your clinician tells you, not to a guess. A diagnosis comes from a clinician, usually from a DEXA scan and sometimes from a fracture history; the scan also gives a baseline, so that a scan a year or two later can show what the training did. A home bioimpedance scale cannot measure bone density; its bone-mass number is an estimate derived from lean mass. There is also a separate switch in Settings that keeps impact work at heel drops regardless of bone status, for anyone with a fragility fracture, a fall in the past year, or a clinician's advice against jumping. Ask your doctor whether a baseline scan makes sense for you. Low body weight is itself a fracture risk factor, and some medications and conditions affect bone, so it is worth telling your doctor that you are training for bone density.</p>`, refs: ['essa', 'liftmor', 'ukcons', 'delaet'] },
  { id: 'fuel', title: 'Eating for bone and muscle on a vegan diet', body: `<p>Muscle and bone are built from what you eat. On a fully plant-based diet, four things need deliberate attention: protein, calcium, vitamin D, and vitamin B12.</p><p><b>Protein.</b> Expert groups recommend 1.2 to 1.6 g per kilogram of body weight a day for adults who strength train. Plant proteins carry a little less leucine, the amino acid that switches on muscle building, and are digested slightly less completely, so on a vegan diet aim at the top of that range and make each portion larger, at least 30 g of protein at a time, adding a fourth meal or a shake when the daily total calls for it. In a 12-week trial, vegans eating 1.6 g/kg from plant sources gained the same muscle and strength from lifting as omnivores on a matched diet (the participants were young men, but it is the most direct test so far). The workhorses are tofu, tempeh, edamame and soy milk; lentils, chickpeas and beans; seitan; and a pea or soy protein powder when a meal falls short.</p><p class="proteinline">${proteinLine()}</p><p><b>Calcium.</b> Women over 50 need 1,200 mg a day. In the EPIC-Oxford study, vegans had more fractures, hip fractures especially, than meat eaters, and the gap was partly explained by lower body weight and lower calcium and protein intake, which is exactly why this card exists. Reliable sources: calcium-set tofu (the label lists calcium sulfate), fortified plant milks and juices (shake the carton, the calcium settles), tempeh, kale, bok choy, collard greens and broccoli, tahini, almonds, and dried figs. Spinach does not count; its calcium is bound by oxalate. There is also good news specific to lifting: in a study comparing vegans with omnivores, the vegans who did regular resistance training had bone microstructure similar to the omnivores, while the vegans who did not train did not.</p><p><b>Vitamin D and B12.</b> Vitamin D, 600 IU a day from age 51 to 70, comes mainly from sun and supplements; vegan D3 made from lichen is widely available, and a blood test shows whether you need it. Vitamin B12 is not optional on a vegan diet: a daily supplement, or fortified foods every day.</p><p><b>Optional: creatine.</b> Vegans start with lower muscle creatine stores and respond well to creatine monohydrate, 3 to 5 g a day (it is made synthetically, not from animals). It reliably adds a little strength and lean mass to resistance training in older adults. Its effect on bone density is not settled: a 12-month trial in postmenopausal women slowed hip bone loss, and a 2-year trial did not raise density. Skip it, or ask your doctor first, if kidney disease is in the picture.</p>`, refs: ['protage', 'morton', 'paddon', 'vanvliet', 'hevia', 'tong', 'wakol', 'nih', 'melina', 'kaviani', 'chilibeck17', 'chilibeck15', 'chilibeck23'] },
  { id: 'kit', title: 'Equipment', body: `<ul class="plain"><li><b>Adjustable dumbbells</b>, a pair that goes to at least 50 lb each. This is the one non-negotiable item: by Level 4 the deadlift and squat need real weight. Fixed dumbbells in 5 lb steps from 5 to 25 lb also work at the lower levels.</li><li><b>Loop resistance bands</b>, a set from light to heavy, for rows, pull-aparts, lateral walks and the Pallof press.</li><li><b>A flat bench</b> for the bench press, hip thrust, one-arm row and rear-foot-elevated split squat.</li><li><b>A sturdy step</b> 6 to 8 inches high (a bottom stair works) for step-ups and, later, drop landings.</li><li><b>A mat</b> for the floor work.</li><li>Later: <b>a weighted vest</b> at 5 to 10 percent of body weight for step-ups and carries. In one five-year trial, vest-and-jumping exercise maintained hip bone density in postmenopausal women while the control group lost bone.</li></ul>`, refs: ['snow', 'essa'] },
  { id: 'levels', title: 'How the levels and Essentials work', body: `<p>Every level has the same three workouts. A is the squat day, B the hinge day, C the overhead and carry day. Each level adds movements, sets and time: roughly 12, 22, 36, 50 and 60 minutes including rests.</p><p>The app suggests moving up after six full sessions at a level spread over at least two weeks, when most sets felt easy or just right. You decide. You can also move down any time in Plan.</p><p>Essentials is the short version of the day's workout: the main lift plus one or two others. Use it on low-energy days; it keeps the rotation moving and counts as a session, though not toward the level-up count. It drops the balance finisher, so a minute of single-leg standing on those days keeps that thread going. Consistency over months is what builds bone, not any single heroic workout.</p><p>This program is the strength half of fitness. The other half is aerobic exercise, which matters at least as much for long-term health: the public-health guidance is at least 150 minutes a week of brisk walking, hiking or similar, on top of strength work on two or more days. The sessions here cover the strength; a daily walk or hike covers the rest, and rest days are made for it.</p>`, refs: ['nsca', 'essa', 'who'] }
];

/* Must run inside a tap: iOS only lets a sound play later if that same element was started by a user gesture first. */
function initAudio() {
  if (!S.sound) return;
  try {
    if (!SND) SND = makeChime();
    if (SND.unlocked) return;
    SND.muted = true;
    const p = SND.play();
    const done = () => { SND.pause(); SND.currentTime = 0; SND.muted = false; SND.unlocked = true; };
    if (p && p.then) p.then(done).catch(() => { SND.muted = false; }); else done();
  } catch (e) { }
}
function beep() {
  if (!S.sound) return;
  try { if (!SND) SND = makeChime(); SND.muted = false; SND.currentTime = 0; const p = SND.play(); if (p && p.catch) p.catch(() => { }); } catch (e) { }
  try { if (navigator.vibrate) navigator.vibrate([120, 60, 120]); } catch (e) { }
}

function logSet(repsOverride) {
  const a = S.active, st = curStep(), ex = EXERCISES[st.id];
  if (a.restUntil) return;
  touch();
  const entry = { id: st.id, set: a.set, w: (ex.load === 'db1' || ex.load === 'db2') && st.kind === 'work' ? (a.w || 0) : null, effort: st.kind === 'work' ? a.effort : null, main: !!st.main, target: { reps: st.reps, secs: st.secs, sets: st.sets }, prev: S.loads[st.id] };
  if (st.secs) entry.secs = a.reps; else entry.reps = repsOverride != null ? repsOverride : a.reps;
  a.log.push(entry);
  if (entry.w != null) { S.loads[st.id] = entry.w; }
  a.sideDone = 0;
  if (S.suggest[st.id]) { entry.sug = S.suggest[st.id]; delete S.suggest[st.id]; }
  S.seen[st.id] = true;
  a.timer = null; a.effort = null;
  const lastSetOfStep = a.set >= st.sets;
  const lastStep = a.i >= a.steps.length - 1;
  if (lastSetOfStep && lastStep) { finishSession(); return; }
  const nextName = lastSetOfStep ? EXERCISES[a.steps[a.i + 1].id].name : `${ex.name}, set ${a.set + 1} of ${st.sets}`;
  if (st.rest >= 30 && st.kind !== 'balance') { a.restTotal = st.rest * 1000; a.restUntil = Date.now() + a.restTotal; a.restNext = nextName; a.pendingAdvance = lastSetOfStep; save(); showRest(); }
  else { if (lastSetOfStep) advance(); else { a.set++; save(); renderSession(); } }
}
function showRest() {
  const a = S.active; const r = $('#rest'); const C = 2 * Math.PI * 100;
  figs.forEach(e => { if ($('#session').contains(e.box)) e.f.stop(); });
  r.innerHTML = `<div><div class="ring"><svg viewBox="0 0 220 220"><circle class="track" cx="110" cy="110" r="100"/><circle class="arc" cx="110" cy="110" r="100" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="0"/></svg><div class="t num">${Math.ceil((a.restUntil - Date.now()) / 1000)}</div></div><div class="next">Rest. Next: ${esc(a.restNext)}</div><div class="row"><button class="btn" data-act="rest30">+30 s</button><button class="btn primary" data-act="restskip">Done resting</button></div><div class="row" style="margin-top:16px;gap:4px"><button class="btn quiet" data-act="restundo" style="color:var(--hero-muted)">Undo that set</button><button class="btn quiet" data-act="pause" style="color:var(--hero-muted)">Pause</button><button class="btn quiet" data-act="endearly" style="color:var(--hero-muted)">End here</button></div></div>`;
  r.hidden = false; startTick();
}
function endRest() {
  const a = S.active; if (!a) return; if (a.restUntil) beep();
  $('#rest').hidden = true; afterRest();
  figs.forEach(e => { if (e.auto && $('#session').contains(e.box)) e.f.play(); });
}
function afterRest() {
  const a = S.active; a.lastRestEnd = Math.min(Date.now(), a.restUntil || Date.now()); a.restUntil = null;
  if (a.pendingAdvance) { a.pendingAdvance = false; advance(); } else { a.set++; save(); renderSession(); }
}
function undoSet() {
  const a = S.active; if (!a || !a.log.length) return;
  const e = a.log.pop(); a.restUntil = null; a.pendingAdvance = false; $('#rest').hidden = true;
  if (e.w != null) { if (e.prev == null) delete S.loads[e.id]; else S.loads[e.id] = e.prev; }
  if (e.sug) S.suggest[e.id] = e.sug;
  a.w = e.w; a.reps = e.secs != null ? e.secs : e.reps; a.effort = e.effort; save(); renderSession();
}
function advance() {
  const a = S.active; a.i++; a.set = 1; a.w = null; a.reps = null; a.effort = null; a.timer = null; a.sideDone = 0;
  if (a.i >= a.steps.length) { finishSession(); return; }
  save(); renderSession();
}
function skipExercise() { const a = S.active; a.timer = null; if (a.i >= a.steps.length - 1) { finishSession(); return; } advance(); }

/* Progression */
function stepUp(ex, w) {
  /* One equipment step while the load is light; up to the exercise increment as loads grow. Keeps each step near 2 to 10 percent. */
  const st = stepLb(); const pct = roundLb(w * 0.1);
  return Math.max(st, Math.min(incFor(ex), pct || st));
}
function computeSuggestions(log) {

    if (!tg || sets[0].effort == null || (tg.secs == null && !(Array.isArray(tg.reps) && tg.reps.length === 2))) continue;
    const hard = sets.filter(s => s.effort === 'hard').length;
    const allTop = sets.length >= tg.sets && sets.every(s => tg.secs ? s.secs >= tg.secs : s.reps >= tg.reps[1]);
    const anyLow = sets.some(s => tg.secs ? s.secs < tg.secs * 0.75 : s.reps < tg.reps[0]);
    if (ex.load === 'db1' || ex.load === 'db2') {
      const each = ex.load === 'db2';
      const w = Math.min(...sets.map(s => s.w || 0));   /* progress from the load every set was completed at */
      if (allTop && hard === 0 && w === 0) { out[id] = { type: 'harder', to: null, text: 'That was easy without weight: next time hold the lightest dumbbells you have.' }; }
      else if (allTop && hard === 0) { const to = roundLb(w + stepUp(ex, w)); out[id] = { type: 'up', from: w, to, text: `Next time ${fmtW(to, each)}, up from ${fmtW(w, each)}` }; }

}
function finishSession() {
  const a = S.active; a.done = true; a.timer = null; a.restUntil = null; $('#rest').hidden = true;
  a.sugg = computeSuggestions(a.log); a.accept = {}; Object.keys(a.sugg).forEach(k => { a.accept[k] = true; });
  a.minutes = Math.max(1, Math.round((Date.now() - a.started - (a.pauseTotal || 0) - (a.pausedAt ? Date.now() - a.pausedAt : 0)) / 60000)); a.pausedAt = null;

}
function summaryView() {
  const a = S.active; const keys = Object.keys(a.sugg);
  const fake = { sets: a.log };
  return `<div class="s-in"><div class="s-top"><div class="prog">Workout ${a.letter} ${a.steps.filter(st => st.kind === 'work').every(st => a.log.filter(x => x.id === st.id).length >= st.sets) ? 'done' : 'ended early'}</div></div>
    <h1 style="margin-bottom:6px">${a.log.length ? 'Nicely done.' : 'Session closed.'}</h1><p class="muted num">${a.minutes} minute${a.minutes === 1 ? '' : 's'}, ${a.log.length} set${a.log.length === 1 ? '' : 's'} logged.</p>
    ${a.log.length ? `<div class="card">${summaryRows(fake)}</div>` : ''}
    ${keys.length ? `<div class="section"><h3>Next time</h3><div class="card"><ul class="rows">${keys.map(k => `<li><div class="grow"><div class="t">${esc(EXERCISES[k].name)}</div><div class="s">${esc(a.sugg[k].text)}</div></div>${a.sugg[k].to != null ? `<button class="chip sm" data-act="accept" data-k="${k}" aria-pressed="${a.accept[k]}">${a.accept[k] ? 'Yes' : 'Keep'}</button>` : ''}</li>`).join('')}</ul><p class="muted small" style="margin:10px 0 0">Yes sets the new weight as the default for the next session. Keep leaves it where it is.</p></div></div>` : (a.log.length ? `<p class="muted" style="margin-top:14px">${a.log.some(x => x.effort === 'hard') ? 'Keep the same weights next time; some sets felt hard. When every set reaches the top of its range and none feel hard, the weight goes up.' : 'No weight changes suggested yet. When every set reaches the top of its range and none feel hard, the weight goes up.'}</p>` : '')}
    <div class="stack" style="margin-top:20px"><button class="btn primary block" data-act="savesession">Save workout</button>${a.log.length ? '' : '<button class="btn outline block" data-act="discard">Discard</button>'}</div></div>`;
}
function saveSession() {
  const a = S.active;
  if (a.log.length) {
    Object.keys(a.sugg).forEach(k => { const s = a.sugg[k]; if (s.to != null) { if (a.accept[k]) S.suggest[k] = { type: s.type, to: s.to, text: (s.type === 'up' ? 'Up to ' : 'Down to ') + fmtW(s.to, EXERCISES[k].load === 'db2') + ' from last time. Change it if today feels different.' }; } else { S.suggest[k] = { type: 'harder', to: null, text: s.text }; } });

    S.sessions.push({ id: Date.now().toString(36), date: new Date().toISOString(), day: todayKey(), letter: a.letter, level: a.level, essentials: a.essentials, complete, minutes: a.minutes, sets: a.log.map(x => ({ id: x.id, set: x.set, w: x.w, reps: x.reps, secs: x.secs, effort: x.effort, main: !!x.main })) });

/* Onboarding */
function onboarding() {
  openSheet(`<h2>Hello, ${esc(S.name)}.</h2><p style="margin-top:8px">Serenity Strength is built for three things that feed each other: muscle strength, steady balance, and stronger bones. Short workouts a few times a week, five levels from about a dozen minutes to an hour, and a log that tells you when to add weight. It is the strength side of fitness; walking, hiking and other aerobic exercise belong alongside it.</p>
    <div class="field"><label>Units</label><div class="seg"><button data-act="ob-units" data-units="lb" aria-pressed="${S.units === 'lb'}">Pounds</button><button data-act="ob-units" data-units="kg" aria-pressed="${S.units === 'kg'}">Kilograms</button></div></div>
    <div class="field"><label>Schedule</label><div class="seg"><button data-act="ob-mode" data-mode="rolling" aria-pressed="${S.schedule.mode === 'rolling'}">Whenever I train</button><button data-act="ob-mode" data-mode="pinned" aria-pressed="${S.schedule.mode === 'pinned'}">Set days</button></div>${S.schedule.mode === 'pinned' ? `<div class="chips" style="margin-top:10px">${DOW.map((d, i) => `<button class="chip day" data-act="ob-day" data-day="${i}" aria-pressed="${S.schedule.days.includes(i)}">${d.slice(0, 2)}</button>`).join('')}</div>` : ''}</div>
    <p class="muted small">Everything is stored on this phone only. You can change any of this in Settings.</p>
    <button class="btn primary block" data-act="ob-done">Begin at Level 1</button>`);
}

/* Events */
document.addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act], [data-tab]'); if (!b) return;
  if (b.dataset.tab && !b.dataset.act) { tab = b.dataset.tab; render(); return; }
  const act = b.dataset.act, a = S.active;

  if (['start', 'resume', 'tstart', 'tstop', 'logset', 'restskip', 'rest30', 'next', 'effort', 'inc', 'dec'].includes(act)) initAudio();
  switch (act) {
    case 'tab': tab = b.dataset.tab; render(); break;
    case 'start': if (S.active && !confirm('A workout is already in progress. Discard it and start fresh?')) return; S.active = null; initAudio(); startSession(b.dataset.letter, b.dataset.ess === '1'); break;
    case 'resume': openSession(); break;
    case 'discard': if (a && a.log.length && !confirm('Discard this workout? The logged sets will be lost.')) return; S.active = null; save(); closeSession(); break;
    case 'pause': closeSession(); toast('Paused. Resume from Today.'); break;
    case 'levelup': setLevel(S.level + 1); render(); toast('Welcome to Level ' + S.level); break;
    case 'snooze': S.snooze = { level: S.level, until: fullAtLevel().length + 3 }; save(); render(); break;
    case 'mode': S.schedule.mode = b.dataset.mode; save(); render(); break;
    case 'day': { const d = +b.dataset.day; const i = S.schedule.days.indexOf(d); if (i >= 0) S.schedule.days.splice(i, 1); else S.schedule.days.push(d); S.schedule.days.sort(); save(); render(); break; }
    case 'level': { const n = +b.dataset.level; if (n === S.level) return; if (confirm(`Change to Level ${n}? Workouts become about ${levelMinutes(n)} minutes.`)) { setLevel(n); render(); } break; }
    case 'card': cardSheet(b.dataset.card); break;
    case 'ex': exerciseSheet(b.dataset.ex); break;
    case 'closesheet': closeSheet(); break;
    case 'units': { if (S.units === b.dataset.units) return; const toKg = b.dataset.units === 'kg'; if (S.weight) S.weight = Math.round((toKg ? S.weight / LB_PER_KG : S.weight * LB_PER_KG) * 10) / 10; S.units = b.dataset.units; save(); render(); break; }
    case 'step': S.step = +b.dataset.step; save(); render(); break;
    case 'bone': S.bone = b.dataset.bone; reconcileImpact(); save(); render(); toast('Impact work adjusted'); break;
    case 'caution': S.caution = !S.caution; reconcileImpact(); save(); render(); toast(S.caution ? 'Impact work kept to heel drops' : 'Impact ladder restored'); break;
    case 'endearly': if (confirm('End the workout here and save what you have done?')) { a.timer = null; a.restUntil = null; $('#rest').hidden = true; finishSession(); } break;
    case 'sound': S.sound = !S.sound; save(); if (S.sound) { if (SND) SND.unlocked = false; initAudio(); beep(); } render(); break;
    case 'export': exportData(); break;
    case 'copy': copyData(); break;
    case 'paste': pasteSheet(); break;
    case 'pasteimport': { const t = $('#pastebox'); if (t && t.value.trim()) importText(t.value.trim()); else toast('Nothing pasted yet.'); break; }
    case 'motion': S.motion = !S.motion; save(); render(); break;
    case 'import': $('#importfile').click(); break;
    case 'reset': if (confirm('Erase all sessions and settings on this device? Export a backup first if you want to keep them.')) { S = fresh(); S.onboarded = true; save(); render(); toast('Erased'); } break;
    /* session */
    case 'next': a.timer = null; advance(); break;
    case 'inc': case 'dec': {
      const k = b.dataset.key, dir = act === 'inc' ? 1 : -1;
      if (k === 'w') a.w = Math.max(0, roundLb((a.w || 0) + dir * stepLb()));
      else { const st = curStep(); a.reps = Math.max(0, (a.reps || 0) + dir * (st.secs ? 5 : 1)); }
      save(); const v = $(`[data-val="${k}"]`, $('#session')); if (v) v.textContent = k === 'w' ? toDisp(a.w) : a.reps; else renderSession();
      if (k === 'reps' && !a.timer) { const tv = $('#tval', $('#session')); if (tv) { tv.textContent = a.reps; tv.dataset.secs = a.reps; const tb = $('[data-act="tstart"]', $('#session')); if (tb) tb.textContent = 'Start ' + a.reps + ' s timer'; } } break;
    }
    case 'effort': { a.effort = b.dataset.effort; save(); const root = $('#session'); root.querySelectorAll('[data-act="effort"]').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.effort === a.effort))); const cap = $('.effort .cap', root); if (cap) cap.textContent = effortCaption(a.effort); const lb = $('[data-act="logset"]', root); if (lb) lb.disabled = false; break; }
    case 'logset': logSet(b.dataset.reps != null ? +b.dataset.reps : null); break;

    case 'tstart': { const el = $('#tval'); const secs = +el.dataset.secs; a.timer = { until: Date.now() + secs * 1000 }; save(); const tb = $('#tblock'); if (tb) { tb.innerHTML = timerBlock(secs, curStep().kind !== 'warm'); startTick(); } else renderSession(); break; }
    case 'tstop': { a.timer = null; save(); const st = curStep(); const tb = $('#tblock'); if (tb) tb.innerHTML = timerBlock(st.kind === 'warm' ? st.secs : a.reps, st.kind !== 'warm'); else renderSession(); break; }
    case 'rest30': a.restUntil += 30000; a.restTotal += 30000; touch(); save(); break;
    case 'restskip': endRest(); break;
    case 'accept': a.accept[b.dataset.k] = !a.accept[b.dataset.k]; save(); b.setAttribute('aria-pressed', String(a.accept[b.dataset.k])); b.textContent = a.accept[b.dataset.k] ? 'Yes' : 'Keep'; break;
    case 'restundo': undoSet(); break;
    case 'savesession': saveSession(); break;
    /* onboarding */
    case 'ob-units': S.units = b.dataset.units; save(); onboarding(); break;
    case 'ob-mode': S.schedule.mode = b.dataset.mode; save(); onboarding(); break;
    case 'ob-day': { const d = +b.dataset.day; const i = S.schedule.days.indexOf(d); if (i >= 0) S.schedule.days.splice(i, 1); else S.schedule.days.push(d); S.schedule.days.sort(); save(); onboarding(); break; }
    case 'ob-done': S.onboarded = true; save(); closeSheet(); render(); break;
  }
});
document.addEventListener('change', (ev) => {
  const t = ev.target;
  if (t.id === 'importfile' && t.files[0]) { importData(t.files[0]); t.value = ''; return; }
  if (t.dataset.set === 'name') { S.name = t.value.trim() || DEFAULT_NAME; save(); toast('Saved'); }
  if (t.dataset.set === 'weight') { const v = parseFloat(t.value); S.weight = isFinite(v) && v > 0 ? v : null; save(); toast('Saved'); }

try {
  const m = { name: 'Serenity Strength', short_name: 'Strength', start_url: location.href.split('#')[0], scope: location.href.replace(/[^/]*$/, ''), display: 'standalone', background_color: '#F4F4F0', theme_color: '#1E6E62', icons: [{ src: ICON192, sizes: '192x192', type: 'image/png' }, { src: ICON512, sizes: '512x512', type: 'image/png' }] };
  const l = document.createElement('link'); l.rel = 'manifest'; l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' })); document.head.appendChild(l);
} catch (e) { }
if (!S.onboarded && REDUCED) { S.motion = false; save(); }
render();
if (!S.onboarded) onboarding();
if (S.active && S.active.done) { try { openSession(); } catch (e) { S.active = null; save(); closeSession(); } }
